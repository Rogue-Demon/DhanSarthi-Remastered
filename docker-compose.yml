version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dhansarthi-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dhansarthi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhansarthi-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dhansarthi}
      SECRET_KEY: ${SECRET_KEY:-dhansarthi_prod_secret_key_change_me_in_env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dhansarthi_jwt_secret_key_change_me_in_env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhansarthi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
